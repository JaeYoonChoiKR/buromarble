<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대학교 마블</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; margin: 10px; text-align: center; background: linear-gradient(#e0f7fa, #fff9e6); min-height: 100vh; }
  button { font-size: 15px; padding: 7px 12px; margin: 3px; cursor: pointer; border-radius: 8px; border: 1px solid #aaa; background: #fff; }
  button.on { outline: 3px solid #333; background: #ffeaa7; }
  button.sw { width: 32px; height: 32px; border-radius: 50%; padding: 0; }
  button:disabled { opacity: .4; cursor: default; }
  .row { margin: 10px 0; }
  #nick { font-size: 16px; padding: 6px; width: 140px; }
  #code { font-size: 18px; padding: 6px; width: 100px; text-align: center; letter-spacing: 4px; text-transform: uppercase; }
  .big { font-size: 18px; padding: 10px 24px; background: #ff7675; color: #fff; border: none; }
  .act { font-size: 17px; padding: 9px 20px; background: #6c5ce7; color: #fff; border: none; }
  #lobbyMsg { min-height: 22px; color: #e03131; font-weight: bold; margin: 6px; }
  #errbar { display: none; position: fixed; top: 0; left: 0; right: 0; background: #e03131; color: #fff;
            padding: 6px; font-size: 13px; z-index: 9999; text-align: left; }

  /* 보드 */
  #board {
    display: grid; grid-template: repeat(5, 1fr) / repeat(5, 1fr); gap: 3px; padding: 3px;
    width: min(96vw, 640px); aspect-ratio: 1; margin: 0 auto; position: relative;
    background: linear-gradient(135deg, #ffeaa7, #fab1a0, #a29bfe, #81ecec);
    border: 3px solid #2d3436; border-radius: 16px;
  }
  .cell { border-radius: 8px; overflow: hidden; position: relative; background: #fff;
          box-shadow: 0 2px 0 rgba(0,0,0,.25); display: flex; flex-direction: column; min-width: 0; }
  .hd { font-size: 10px; font-weight: bold; text-align: center; padding: 2px 0; color: #fff;
        text-shadow: 0 1px 1px rgba(0,0,0,.4); white-space: nowrap; }
  .ill { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; min-height: 0; }
  .ill svg { height: 100%; max-width: 100%; }
  .ill img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .emo { font-size: 26px; }
  .ft { font-size: 9px; text-align: center; background: #f5f6fa; padding: 1px 0; white-space: nowrap; font-weight: bold; }
  .own { position: absolute; inset: 0; border: 4px solid transparent; border-radius: 8px; pointer-events: none; z-index: 2; }
  #center {
    grid-area: 2 / 2 / 5 / 5; display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 6px; font-size: 13px; border-radius: 12px;
    background: radial-gradient(circle at 30% 20%, #ffffff, #dff9fb);
  }
  #center h2 { margin: 0 0 6px; font-size: 18px; color: #6c5ce7; }
  #evt { font-size: 11px; color: #888; margin-bottom: 4px; }
  .prow { display: flex; align-items: center; gap: 4px; margin: 1px 0; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
  .token { position: absolute; width: 32px; z-index: 5; display: flex; flex-direction: column;
           align-items: center; transition: left .25s, top .25s; }
  .token .av { line-height: 0; }
  .token.active .av { animation: bob .5s ease-in-out infinite alternate; filter: drop-shadow(0 0 4px #f1c40f); }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
  .nick { font-size: 9px; background: rgba(255,255,255,.92); border-radius: 3px; white-space: nowrap; padding: 0 2px; }
  #log { background: #fff; border-radius: 10px; padding: 8px; height: 130px; overflow-y: auto; text-align: left;
         width: min(96vw, 640px); margin: 0 auto; font-size: 13px; border: 1px solid #ddd; }
  #bar { width: min(96vw, 640px); margin: 0 auto 4px; display: flex; justify-content: space-between; align-items: center; }
  #roomInfo { font-size: 15px; }
  #roomInfo b { letter-spacing: 3px; color: #6c5ce7; font-size: 18px; }

  /* 3D 주사위 */
  #diceWrap { position: absolute; left: 50%; top: 50%; width: 70px; height: 70px; margin: -35px 0 0 -35px;
              perspective: 500px; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .3s; }
  #diceWrap.show { opacity: 1; }
  #diceHop { width: 100%; height: 100%; transform-style: preserve-3d; }
  #dice { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }
  .face { position: absolute; width: 70px; height: 70px; background: #fff; border: 2px solid #ccc; border-radius: 12px;
          display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 9px; }
  .face > div { display: flex; align-items: center; justify-content: center; }
  .pip { width: 12px; height: 12px; border-radius: 50%; background: #2d3436; }
  .pip.red { background: #e74c3c; width: 16px; height: 16px; }
  @keyframes hop { 0% { transform: translateY(0); } 30% { transform: translateY(-45px); } 60% { transform: translateY(0); }
                   75% { transform: translateY(-14px); } 100% { transform: translateY(0); } }

  /* 대결 이벤트 */
  #duelBox { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 78%;
             z-index: 30; background: #fff; border: 3px solid #6c5ce7; border-radius: 14px; padding: 8px;
             box-shadow: 0 6px 20px rgba(0,0,0,.35); font-size: 13px; }
  #duelBox.show { display: block; }
  .dtitle { font-weight: bold; color: #6c5ce7; margin-bottom: 4px; }
  .dvs { display: flex; justify-content: space-around; align-items: center; }
  .dside { padding: 4px 8px; border-radius: 10px; border: 2px solid transparent; }
  .dside.win { border-color: #f1c40f; background: #fff9db; }
  .dname { font-size: 11px; }
  .dnum { font-size: 26px; font-weight: bold; color: #e17055; }
  .vs { font-weight: bold; color: #888; }
  #dmsg { margin: 4px 0; font-weight: bold; }

  /* 구매 / 통행료 카드 */
  #cardBox { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 74%;
             z-index: 35; background: #fff; border: 3px solid #333; border-radius: 14px; overflow: hidden;
             box-shadow: 0 8px 24px rgba(0,0,0,.4); font-size: 13px; }
  #cardBox.show { display: block; animation: pop .25s ease-out; }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(.6); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  .chead { color: #fff; font-weight: bold; padding: 6px; font-size: 15px; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .cbody { padding: 8px; }
  .cbody svg { height: 56px; }
  .cline { margin: 3px 0; }
  .warn { color: #e03131; font-weight: bold; }
  .small { font-size: 10px; color: #888; margin-top: 4px; }

  /* 알림 / 종료 */
  #toast { position: absolute; left: 50%; top: 13%; transform: translateX(-50%); z-index: 40; padding: 8px 14px;
           border-radius: 20px; color: #fff; font-weight: bold; font-size: 13px; opacity: 0; transition: opacity .3s;
           pointer-events: none; white-space: nowrap; box-shadow: 0 3px 10px rgba(0,0,0,.3); }
  #toast.show { opacity: 1; }
  #endBox { display: none; position: absolute; inset: 8%; z-index: 50; background: rgba(255,255,255,.97);
            border: 3px solid #f1c40f; border-radius: 16px; padding: 10px; overflow-y: auto; }
  #endBox.show { display: block; }
  #endBox h2 { margin: 4px 0 8px; color: #e17055; }
  .erow { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 4px 0; font-size: 15px; }
</style>
</head>
<body>
<div id="errbar"></div>

<!-- 1. 꾸미기 + 입장 화면 -->
<div id="lobby">
  <h1>🎓 대학교 마블</h1>
  <div id="preview"></div>
  <div class="row">닉네임 <input id="nick" maxlength="6" placeholder="최대 6글자"></div>
  <div class="row"><b>피부색</b> <span id="opt-skin"></span></div>
  <div class="row"><b>머리색</b> <span id="opt-hair"></span></div>
  <div class="row"><b>머리 스타일</b> <span id="opt-style"></span></div>
  <div class="row"><b>상의</b> <span id="opt-top"></span></div>
  <div class="row"><b>상의 색</b> <span id="opt-topColor"></span></div>
  <div class="row"><b>하의</b> <span id="opt-bottom"></span></div>
  <div class="row"><b>악세사리</b>
    <label><input type="checkbox" id="hat"> 모자</label>
    <label><input type="checkbox" id="glasses"> 안경</label>
  </div>
  <hr>
  <div class="row"><button id="btnCreate" class="big">🏠 방 만들기</button></div>
  <div class="row">방 코드 <input id="code" maxlength="4" placeholder="ABCD"> <button id="btnJoin" class="act">코드로 참여</button></div>
  <div class="row"><button id="btnQuick">⚡ 빠른 입장 (아무 방)</button></div>
  <div id="lobbyMsg"></div>
</div>

<!-- 2. 게임 화면 -->
<div id="game" style="display:none">
  <div id="bar">
    <div id="roomInfo"></div>
    <div><button id="copyBtn">🔗 초대 링크 복사</button><button id="snd">🔊 소리</button></div>
  </div>
  <div id="board">
    <div id="center">
      <h2>🎓 대학교 마블</h2>
      <div id="status"></div>
      <div id="evt"></div>
      <div id="players"></div>
    </div>
    <div id="diceWrap"><div id="diceHop"><div id="dice"></div></div></div>
    <div id="duelBox"></div>
    <div id="cardBox"></div>
    <div id="toast"></div>
    <div id="endBox"></div>
  </div>
  <div>
    <button id="roll" class="act">🎲 주사위</button>
  </div>
  <div id="log"></div>
</div>

<!-- 오류가 나면 화면 맨 위에 빨간 띠로 알려주는 코드 -->
<script>
  function showErr(msg) {
    const el = document.getElementById('errbar');
    el.style.display = 'block';
    el.textContent = '⚠️ 오류: ' + msg;
  }
  window.addEventListener('error', (e) => showErr(e.message));
</script>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  setInterval(() => fetch('/ping').catch(() => {}), 4 * 60 * 1000); // 서버 깨우기용
  socket.on('connect_error', (err) => showErr('서버 연결 실패: ' + err.message));

  const COLORS = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12'];
  const SKINS = ['#ffe0c2', '#f5c8a0', '#d9a273', '#9c6b45'];
  const SKIN_NAMES = ['밝은 피부', '보통 피부', '구릿빛', '진한 피부'];
  const HAIR = ['#222222', '#6b4423', '#e5c07b', '#c0392b', '#2980b9', '#ff6b9d'];
  const HAIR_NAMES = ['검정', '갈색', '금발', '빨강', '파랑', '분홍'];
  const STYLES = ['짧은 머리', '단발', '긴 머리', '포니테일'];
  const TOPS = ['남 티셔츠', '남 후드', '여 블라우스', '여 니트'];
  const TOP_COLORS = ['#4aa3ff', '#ff6b6b', '#2ed573', '#ffa502', '#a29bfe', '#ff7eb6'];
  const TOP_COLOR_NAMES = ['파랑', '빨강', '초록', '주황', '보라', '분홍'];
  const BOTTOMS = ['남 청바지', '남 반바지', '여 치마', '여 롱스커트'];
  const POS = [[0,0],[0,1],[0,2],[0,3],[0,4],[1,4],[2,4],[3,4],[4,4],[4,3],[4,2],[4,1],[4,0],[3,0],[2,0],[1,0]];

  const me = { hair: 0, style: 0, skin: 0, top: 0, topColor: 0, bottom: 0, hat: false, glasses: false };
  let myId = null, roomCode = '', built = false, order = [], seenSeq = null, seenDuel = null, seenNotice = null, curState = null;
  let seenCardKey = null, endShown = false;
  const tokens = {}, shown = {}, timers = {};
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- 효과음 ----------
  let audioCtx = null, soundOn = true;
  function beep(freq, dur, type, vol, when) {
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.value = vol;
      o.connect(g);
      g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + (when || 0);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t);
      o.stop(t + dur);
    } catch (e) {}
  }
  const sfx = {
    dice() { for (let i = 0; i < 7; i++) beep(180 + Math.random() * 220, 0.06, 'square', 0.04, i * 0.13); },
    coin() { beep(880, 0.1, 'triangle', 0.1, 0); beep(1320, 0.2, 'triangle', 0.1, 0.1); },
    alert() { beep(320, 0.2, 'sawtooth', 0.06, 0); beep(220, 0.3, 'sawtooth', 0.06, 0.18); },
    duel() { beep(500, 0.1, 'square', 0.05, 0); beep(700, 0.1, 'square', 0.05, 0.12); beep(900, 0.2, 'square', 0.05, 0.24); },
    win() { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.25, 'triangle', 0.1, i * 0.15)); },
  };

  // ---------- 캐릭터 ----------
  let avSeq = 0;
  function shade(hex, p) {
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const t = p < 0 ? 0 : 255, q = Math.abs(p);
    r = Math.round((t - r) * q + r);
    g = Math.round((t - g) * q + g);
    b = Math.round((t - b) * q + b);
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  }

  function avatarSVG(a, w) {
    const u = 'av' + (++avSeq);
    const skin = SKINS[a.skin] || SKINS[0];
    const hair = HAIR[a.hair] || HAIR[0];
    const tc = TOP_COLORS[a.topColor] || TOP_COLORS[0];
    const skinD = shade(skin, -0.14), hairD = shade(hair, -0.35), tcD = shade(tc, -0.28);
    const h = Math.round((w * 50) / 40);
    const SK = `url(#${u}s)`, HR = `url(#${u}h)`, TP = `url(#${u}t)`;
    const shoe = (x) => `<ellipse cx="${x}" cy="47" rx="4.2" ry="2" fill="#f1f2f6" stroke="#636e72" stroke-width=".6"/><path d="M${x - 3} 46.2 Q${x} 45 ${x + 3} 46.2" stroke="#b2bec3" stroke-width=".5" fill="none"/>`;

    let s = `<defs>` +
      `<radialGradient id="${u}s" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="${shade(skin, 0.3)}"/><stop offset="1" stop-color="${skin}"/></radialGradient>` +
      `<linearGradient id="${u}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(hair, 0.28)}"/><stop offset="1" stop-color="${hair}"/></linearGradient>` +
      `<linearGradient id="${u}t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${shade(tc, 0.25)}"/><stop offset="1" stop-color="${shade(tc, -0.12)}"/></linearGradient>` +
      `</defs>`;
    s += `<ellipse cx="20" cy="48.5" rx="11" ry="2" fill="#000" opacity=".18"/>`;

    // 뒷머리
    if (a.style === 1) s += `<path d="M8 18 Q7 3 20 3 Q33 3 32 18 L32.5 26 Q31 28 28.5 26 L11.5 26 Q9 28 7.5 26Z" fill="${HR}"/>`;
    else if (a.style === 2) s += `<path d="M8.5 17 Q8 3 20 3 Q32 3 31.5 17 L33 33 Q20 36.5 7 33Z" fill="${HR}"/>`;
    else if (a.style === 3) s += `<path d="M28 9 Q38.5 7.5 36.5 22 Q35.5 29 31.5 31 Q34 21 29 15Z" fill="${HR}"/>`;

    // 팔 + 손
    s += `<rect x="7" y="29" width="5.5" height="10" rx="2.7" fill="${SK}"/><rect x="27.5" y="29" width="5.5" height="10" rx="2.7" fill="${SK}"/>`;
    s += `<circle cx="9.7" cy="39.5" r="2.6" fill="${SK}"/><circle cx="30.3" cy="39.5" r="2.6" fill="${SK}"/>`;

    // 하의
    if (a.bottom === 0) {
      s += `<rect x="13" y="37" width="6.6" height="9.5" rx="1" fill="#2f66b8"/><rect x="20.4" y="37" width="6.6" height="9.5" rx="1" fill="#2f66b8"/><rect x="12.5" y="36.5" width="15" height="2.2" fill="#1f4a8a"/><line x1="20" y1="38.5" x2="20" y2="46" stroke="#1f4a8a" stroke-width=".5"/><line x1="16.3" y1="41" x2="16.3" y2="45" stroke="#5b8fd6" stroke-width=".5" opacity=".7"/>` + shoe(16.3) + shoe(23.7);
    } else if (a.bottom === 1) {
      s += `<rect x="14" y="41" width="5" height="6" fill="${SK}"/><rect x="21" y="41" width="5" height="6" fill="${SK}"/><rect x="13" y="37" width="6.8" height="5.5" rx="1" fill="#e1a95f"/><rect x="20.2" y="37" width="6.8" height="5.5" rx="1" fill="#e1a95f"/><rect x="12.5" y="36.5" width="15" height="1.8" fill="#b9823a"/>` + shoe(16.3) + shoe(23.7);
    } else if (a.bottom === 2) {
      s += `<rect x="14.5" y="42" width="4" height="5" fill="${SK}"/><rect x="21.5" y="42" width="4" height="5" fill="${SK}"/>` + shoe(16.5) + shoe(23.5) +
           `<path d="M12.5 37 L27.5 37 L30 43.5 L10 43.5Z" fill="#ff6fb5"/><path d="M10.5 42 L29.5 42" stroke="#fff" stroke-width=".8" opacity=".7"/><path d="M16 38 L14.5 43 M20 38 L20 43 M24 38 L25.5 43" stroke="#e84393" stroke-width=".5" opacity=".6"/>`;
    } else {
      s += `<path d="M12.5 37 L27.5 37 L31 47 L9 47Z" fill="#7d6bff"/><path d="M10 45 L30 45" stroke="#fff" stroke-width=".8" opacity=".6"/><path d="M16 38 L14 46 M20 38 L20 46 M24 38 L26 46" stroke="#5f4fe0" stroke-width=".5" opacity=".6"/><ellipse cx="16" cy="48" rx="3.5" ry="1.6" fill="#f1f2f6"/><ellipse cx="24" cy="48" rx="3.5" ry="1.6" fill="#f1f2f6"/>`;
    }

    // 목
    s += `<rect x="17.5" y="24" width="5" height="5" rx="1.5" fill="${skinD}"/>`;

    // 상의
    if (a.top === 0) {
      s += `<rect x="12" y="27" width="16" height="11" rx="3" fill="${TP}"/><rect x="8" y="27.5" width="6" height="6" rx="2.5" fill="${TP}"/><rect x="26" y="27.5" width="6" height="6" rx="2.5" fill="${TP}"/><rect x="12" y="32" width="16" height="1.6" fill="#fff" opacity=".55"/><path d="M17 27 Q20 31 23 27Z" fill="${SK}"/>`;
    } else if (a.top === 1) {
      s += `<rect x="7" y="28" width="6" height="10.5" rx="3" fill="${TP}"/><rect x="27" y="28" width="6" height="10.5" rx="3" fill="${TP}"/><rect x="12" y="27" width="16" height="11" rx="3" fill="${TP}"/><path d="M14 27 Q20 33 26 27 Q26 24.5 20 24.5 Q14 24.5 14 27Z" fill="${tcD}"/><line x1="18.5" y1="30" x2="18.5" y2="34" stroke="#fff" stroke-width=".7"/><line x1="21.5" y1="30" x2="21.5" y2="34" stroke="#fff" stroke-width=".7"/><rect x="15" y="33" width="10" height="3.5" rx="1.5" fill="${tcD}"/><rect x="7" y="36.5" width="6" height="2" rx="1" fill="${tcD}"/><rect x="27" y="36.5" width="6" height="2" rx="1" fill="${tcD}"/>`;
    } else if (a.top === 2) {
      s += `<path d="M13 27 L27 27 L29.5 38 L10.5 38Z" fill="${TP}"/><circle cx="9.5" cy="30" r="3.6" fill="${TP}"/><circle cx="30.5" cy="30" r="3.6" fill="${TP}"/><path d="M17 27 L20 32 L23 27Z" fill="${SK}"/><path d="M17 27 L20 32 L23 27" fill="none" stroke="#fff" stroke-width="1"/><path d="M20 32 L17.5 33.5 L17.5 31Z M20 32 L22.5 33.5 L22.5 31Z" fill="#fff" opacity=".85"/>`;
    } else {
      s += `<rect x="7" y="28" width="6" height="10.5" rx="3" fill="${TP}"/><rect x="27" y="28" width="6" height="10.5" rx="3" fill="${TP}"/><rect x="12" y="27" width="16" height="11" rx="3" fill="${TP}"/><line x1="20" y1="28" x2="20" y2="38" stroke="${tcD}" stroke-width="1"/><circle cx="18.2" cy="31" r=".9" fill="${tcD}"/><circle cx="18.2" cy="35" r=".9" fill="${tcD}"/><path d="M17 27 Q20 31 23 27Z" fill="${SK}"/><rect x="7" y="36.5" width="6" height="2" rx="1" fill="${tcD}"/><rect x="27" y="36.5" width="6" height="2" rx="1" fill="${tcD}"/>`;
    }
    s += `<path d="M14.5 36 Q15.5 33.5 14.5 31.5" stroke="${tcD}" stroke-width=".6" fill="none" opacity=".45"/><path d="M25.5 36 Q24.5 33.5 25.5 31.5" stroke="${tcD}" stroke-width=".6" fill="none" opacity=".45"/>`;

    // 머리/얼굴
    s += `<circle cx="9.2" cy="17" r="2" fill="${SK}"/><circle cx="30.8" cy="17" r="2" fill="${SK}"/><circle cx="20" cy="16" r="11" fill="${SK}"/>`;
    s += `<circle cx="13.5" cy="20.7" r="2.1" fill="#ff8fa3" opacity=".5"/><circle cx="26.5" cy="20.7" r="2.1" fill="#ff8fa3" opacity=".5"/>`;
    s += `<path d="M12.6 12.8 Q15.3 11.4 18 12.6" stroke="${hairD}" stroke-width=".9" fill="none" stroke-linecap="round"/><path d="M22 12.6 Q24.7 11.4 27.4 12.8" stroke="${hairD}" stroke-width=".9" fill="none" stroke-linecap="round"/>`;
    s += `<ellipse cx="15.5" cy="17.2" rx="1.6" ry="2.1" fill="#2d3436"/><ellipse cx="24.5" cy="17.2" rx="1.6" ry="2.1" fill="#2d3436"/>`;
    s += `<circle cx="16.1" cy="16.4" r=".7" fill="#fff"/><circle cx="15" cy="18.2" r=".35" fill="#fff"/><circle cx="25.1" cy="16.4" r=".7" fill="#fff"/><circle cx="24" cy="18.2" r=".35" fill="#fff"/>`;
    s += `<path d="M19.4 20.4 Q20 21 20.6 20.4" stroke="${skinD}" stroke-width=".7" fill="none" stroke-linecap="round"/>`;
    s += `<path d="M17.8 22.8 Q20 25 22.2 22.8" stroke="#c0392b" stroke-width="1" fill="none" stroke-linecap="round"/>`;

    // 앞머리
    if (a.style === 1 || a.style === 2) {
      s += `<path d="M8.6 19 Q7.5 3.5 20 3.5 Q32.5 3.5 31.4 19 Q30 11 20 9.5 Q10 11 8.6 19Z" fill="${HR}"/>`;
    } else {
      s += `<path d="M9.2 17 Q8 4 20 4 Q32 4 30.8 17 Q29 10.5 25 10.8 Q20 5 15 10.8 Q11 10.5 9.2 17Z" fill="${HR}"/>`;
    }
    if (a.style === 2) s += `<path d="M9 17 Q8.5 24 10.5 27.5 Q11.3 20 12.8 14Z" fill="${HR}"/><path d="M31 17 Q31.5 24 29.5 27.5 Q28.7 20 27.2 14Z" fill="${HR}"/>`;
    s += `<path d="M13.5 7.5 Q17 5 21.5 5.8" stroke="#fff" opacity=".4" stroke-width="1.3" fill="none" stroke-linecap="round"/>`;
    if (a.style === 3) s += `<circle cx="29.6" cy="10" r="1.7" fill="#ff6b9d"/>`;

    // 악세사리
    if (a.glasses) {
      s += `<circle cx="15.5" cy="17" r="3.6" fill="#fff" fill-opacity=".25" stroke="#2d3436" stroke-width="1"/><circle cx="24.5" cy="17" r="3.6" fill="#fff" fill-opacity=".25" stroke="#2d3436" stroke-width="1"/><line x1="19.1" y1="17" x2="20.9" y2="17" stroke="#2d3436" stroke-width="1"/><path d="M13.5 15.2 L15 14.4" stroke="#fff" stroke-width=".6" opacity=".8"/>`;
    }
    if (a.hat) {
      s += `<path d="M9.5 11 Q9.5 1 20 1 Q30.5 1 30.5 11Z" fill="#e74c3c"/><path d="M13 3.5 Q16 2 19 2" stroke="#fff" opacity=".4" stroke-width="1" fill="none"/><rect x="9" y="10" width="22" height="2.5" rx="1.2" fill="#c0392b"/><path d="M20 10.5 Q31 9.5 35 13 Q28 13.5 20 12.5Z" fill="#c0392b"/><circle cx="20" cy="1.5" r="1.2" fill="#fff"/>`;
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 50" width="${w}" height="${h}">${s}</svg>`;
  }

  // ---------- 건물 그림 ----------
  const BLD = {
    1: { c: '#ffeaa7', r: '#e17055', k: 'tri', e: '💼' },
    2: { c: '#dfe6e9', r: '#636e72', k: 'dome', e: '🏛' },
    3: { c: '#c7ecee', r: '#00b894', k: 'tri', e: '🌲' },
    5: { c: '#fab1a0', r: '#d63031', k: 'flat', e: '🎓' },
    6: { c: '#fdcb6e', r: '#e17055', k: 'dome', e: '⭐' },
    7: { c: '#badc58', r: '#6ab04c', k: 'tri', e: '🌾' },
    9: { golf: true },
    10: { c: '#a29bfe', r: '#6c5ce7', k: 'flat', e: '🤝' },
    11: { c: '#ffbe76', r: '#f0932b', k: 'tri', e: '💡' },
    13: { c: '#74b9ff', r: '#0984e3', k: 'dome', e: '📚' },
    14: { c: '#7bed9f', r: '#2ed573', k: 'tri', e: '🧬' },
    15: { c: '#ff7979', r: '#eb4d4b', k: 'flat', e: '🏀' },
  };
  function bldSVG(i) {
    const B = BLD[i];
    if (B.golf) {
      return `<svg viewBox="0 0 40 34"><ellipse cx="20" cy="28" rx="19" ry="8" fill="#55c57a" stroke="#3aa860"/><rect x="25" y="6" width="1.2" height="20" fill="#555"/><path d="M26.2 6 L35 9.5 L26.2 13Z" fill="#e74c3c"/><circle cx="13" cy="26" r="2.2" fill="#fff" stroke="#bbb" stroke-width=".5"/><ellipse cx="25.5" cy="26.5" rx="3" ry="1" fill="#2d3436"/></svg>`;
    }
    let roof;
    if (B.k === 'tri') roof = `<path d="M4 14 L20 3 L36 14Z" fill="${B.r}"/>`;
    else if (B.k === 'dome') roof = `<path d="M8 14 Q8 2 20 2 Q32 2 32 14Z" fill="${B.r}"/>`;
    else roof = `<rect x="4" y="11" width="32" height="4" rx="1" fill="${B.r}"/>`;
    const wins = [10, 17.5, 25].map((x) => `<rect x="${x}" y="18" width="5" height="5" rx="1" fill="#dff9fb" stroke="#74b9ff" stroke-width=".5"/>`).join('');
    return `<svg viewBox="0 0 40 34"><rect x="5" y="14" width="30" height="17" fill="${B.c}"/>${roof}${wins}<rect x="17" y="24" width="6" height="7" rx="1" fill="#6c4a2d"/><rect x="2" y="31" width="36" height="2" rx="1" fill="#000" opacity=".2"/><text x="20" y="${B.k === 'flat' ? 10 : 12}" font-size="8" text-anchor="middle">${B.e}</text></svg>`;
  }
  const CORNER_EMO = { 0: '📖', 4: '💰', 8: '📝', 12: '🎉' };
  const CORNER_BG = { 0: '#ffd6d6', 4: '#d6f5d6', 8: '#fff0c2', 12: '#e0d6ff' };
  const groupColor = (i) => (i < 4 ? '#ff6b6b' : i < 8 ? '#4dabf7' : i < 12 ? '#20c997' : '#f59f00');

  // ---------- 꾸미기 + 입장 화면 ----------
  function makeOptions(id, labels, key, colors) {
    const box = document.getElementById(id);
    box.innerHTML = '';
    labels.forEach((label, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      if (colors) { b.className = 'sw'; b.style.background = colors[i]; b.title = label; }
      else b.textContent = label;
      if (me[key] === i) b.classList.add('on');
      b.onclick = () => { me[key] = i; refreshLobby(); };
      box.appendChild(b);
    });
  }
  function refreshLobby() {
    makeOptions('opt-skin', SKIN_NAMES, 'skin', SKINS);
    makeOptions('opt-hair', HAIR_NAMES, 'hair', HAIR);
    makeOptions('opt-style', STYLES, 'style');
    makeOptions('opt-top', TOPS, 'top');
    makeOptions('opt-topColor', TOP_COLOR_NAMES, 'topColor', TOP_COLORS);
    makeOptions('opt-bottom', BOTTOMS, 'bottom');
    document.getElementById('preview').innerHTML = avatarSVG(me, 160);
  }
  document.getElementById('hat').onchange = (e) => { me.hat = e.target.checked; refreshLobby(); };
  document.getElementById('glasses').onchange = (e) => { me.glasses = e.target.checked; refreshLobby(); };
  refreshLobby();

  // 초대 링크(?room=ABCD)로 들어오면 코드 칸을 자동으로 채움
  const qRoom = new URLSearchParams(location.search).get('room');
  if (qRoom) document.getElementById('code').value = qRoom.toUpperCase().slice(0, 4);

  const lobbyMsg = document.getElementById('lobbyMsg');
  function sendEnter(type) {
    const name = document.getElementById('nick').value.trim().slice(0, 6);
    const code = document.getElementById('code').value.trim().toUpperCase();
    if (type === 'join' && code.length !== 4) {
      lobbyMsg.textContent = '방 코드 4글자를 입력해 주세요.';
      return;
    }
    lobbyMsg.textContent = '';
    socket.emit(type, { name, avatar: me, code });
  }
  document.getElementById('btnCreate').onclick = () => sendEnter('create');
  document.getElementById('btnJoin').onclick = () => sendEnter('join');
  document.getElementById('btnQuick').onclick = () => sendEnter('quick');

  socket.on('joinError', (msg) => { lobbyMsg.textContent = msg; });
  socket.on('joined', (d) => {
    myId = d.id;
    roomCode = d.code;
    document.getElementById('roomInfo').innerHTML = '방 코드 <b>' + esc(d.code) + '</b>';
    document.getElementById('lobby').style.display = 'none';
    document.getElementById('game').style.display = 'block';
  });

  document.getElementById('copyBtn').onclick = (e) => {
    const link = location.origin + '/?room=' + roomCode;
    const btn = e.target;
    const done = () => { btn.textContent = '✅ 복사됨'; setTimeout(() => { btn.textContent = '🔗 초대 링크 복사'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(done).catch(() => prompt('아래 링크를 복사하세요', link));
    } else {
      prompt('아래 링크를 복사하세요', link);
    }
  };
  document.getElementById('snd').onclick = (e) => {
    soundOn = !soundOn;
    e.target.textContent = soundOn ? '🔊 소리' : '🔇 소리 꺼짐';
  };

  // ---------- 3D 주사위 ----------
  const FACE_T = { 1: 'translateZ(35px)', 6: 'rotateY(180deg) translateZ(35px)', 2: 'rotateY(90deg) translateZ(35px)',
                   5: 'rotateY(-90deg) translateZ(35px)', 3: 'rotateX(90deg) translateZ(35px)', 4: 'rotateX(-90deg) translateZ(35px)' };
  const PIPS = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
  const END = { 1: [0, 0], 6: [0, 180], 2: [0, -90], 5: [0, 90], 3: [-90, 0], 4: [90, 0] };
  const diceEl = document.getElementById('dice');
  for (let n = 1; n <= 6; n++) {
    const f = document.createElement('div');
    f.className = 'face';
    f.style.transform = FACE_T[n];
    for (let k = 1; k <= 9; k++) {
      const c = document.createElement('div');
      if (PIPS[n].includes(k)) {
        const p = document.createElement('div');
        p.className = 'pip' + (n === 1 ? ' red' : '');
        c.appendChild(p);
      }
      f.appendChild(c);
    }
    diceEl.appendChild(f);
  }
  let hideTimer;
  function rollDice(n) {
    const wrap = document.getElementById('diceWrap');
    const hop = document.getElementById('diceHop');
    clearTimeout(hideTimer);
    const tilt = 'rotateX(-24deg) rotateY(-30deg) ';
    diceEl.style.transition = 'none';
    diceEl.style.transform = tilt + `rotateX(${Math.floor(Math.random() * 360)}deg) rotateY(${Math.floor(Math.random() * 360)}deg)`;
    wrap.classList.add('show');
    hop.style.animation = 'none'; void hop.offsetWidth; hop.style.animation = 'hop 1.1s ease-out';
    void diceEl.offsetWidth;
    const [rx, ry] = END[n];
    diceEl.style.transition = 'transform 1.1s cubic-bezier(.15,.7,.2,1)';
    diceEl.style.transform = tilt + `rotateX(${rx + 720}deg) rotateY(${ry + 1080}deg)`;
    sfx.dice();
    hideTimer = setTimeout(() => wrap.classList.remove('show'), 2200);
  }

  // ---------- 대결 이벤트 ----------
  let duelVisible = false, duelTimer = null, duelShowTimer = null, duelHideTimer = null;
  function hideDuel() {
    clearInterval(duelTimer);
    clearTimeout(duelShowTimer);
    clearTimeout(duelHideTimer);
    document.getElementById('duelBox').classList.remove('show');
    duelVisible = false;
  }
  function showDuel(d) {
    const s = curState;
    const pa = s.players.find((p) => p.id === d.a);
    const pb = s.players.find((p) => p.id === d.b);
    if (!pa || !pb) return;
    clearTimeout(duelHideTimer);
    const box = document.getElementById('duelBox');
    const side = (p, k) => `<div class="dside" id="d${k}">${avatarSVG(p.avatar, 36)}<div class="dname"></div><div class="dnum" id="n${k}">?</div></div>`;
    box.innerHTML = `<div class="dtitle">⚔️ ${esc(d.reason)}! 주사위 대결</div><div class="dvs">${side(pa, 'A')}<div class="vs">VS</div>${side(pb, 'B')}</div><div id="dmsg"></div><div id="dbtn"></div>`;
    box.querySelector('#dA .dname').textContent = pa.name;
    box.querySelector('#dB .dname').textContent = pb.name;
    box.classList.add('show');
    duelVisible = true;
    sfx.duel();
    const nA = box.querySelector('#nA');
    const nB = box.querySelector('#nB');
    let t = 0;
    clearInterval(duelTimer);
    duelTimer = setInterval(() => {
      t++;
      if (t < 14) {
        nA.textContent = 1 + Math.floor(Math.random() * 6);
        nB.textContent = 1 + Math.floor(Math.random() * 6);
        return;
      }
      clearInterval(duelTimer);
      nA.textContent = d.ra;
      nB.textContent = d.rb;
      box.querySelector(d.winner === d.a ? '#dA' : '#dB').classList.add('win');
      const w = d.winner === d.a ? pa : pb;
      const msg = box.querySelector('#dmsg');
      const btn = box.querySelector('#dbtn');
      if (d.winner === myId) {
        msg.textContent = '🎉 승리! 자리를 바꿀까요?';
        btn.innerHTML = '<button class="act" id="bSwap">자리 바꾸기</button><button id="bKeep">그대로</button>';
        box.querySelector('#bSwap').onclick = () => { socket.emit('swap', true); btn.innerHTML = ''; };
        box.querySelector('#bKeep').onclick = () => { socket.emit('swap', false); btn.innerHTML = ''; };
      } else {
        msg.textContent = `⏳ ${w.name}님이 선택 중...`;
      }
    }, 80);
  }

  // ---------- 구매 / 통행료 카드 ----------
  let cardShown = false, cardTimer = null;
  function hideCard() {
    clearTimeout(cardTimer);
    document.getElementById('cardBox').classList.remove('show');
    cardShown = false;
  }
  function showCard() {
    const s = curState;
    const cur = s.players[s.turn];
    if (!cur || cur.id !== myId) return;
    const cell = s.board[cur.pos];
    const box = document.getElementById('cardBox');
    if (s.phase === 'buy') {
      const after = cur.money - cell.price;
      box.innerHTML = `<div class="chead" style="background:${groupColor(cur.pos)}">🏫 ${esc(cell.name)}</div>` +
        `<div class="cbody">${bldSVG(cur.pos)}` +
        `<div class="cline">구매가 <b>${cell.price}만</b> · 통행료 <b>${cell.toll}만</b></div>` +
        `<div class="cline">내 자금 ${cur.money}만 → <b>${after}만</b></div>` +
        `<div><button class="act" id="cBuy">구매하기</button><button id="cSkip">패스</button></div>` +
        `<div class="small">25초 안에 고르지 않으면 자동으로 패스돼요</div></div>`;
      box.querySelector('#cBuy').onclick = () => { socket.emit('buy'); hideCard(); };
      box.querySelector('#cSkip').onclick = () => { socket.emit('skip'); hideCard(); };
      sfx.coin();
    } else if (s.phase === 'toll' && s.pending) {
      const owner = s.players.find((p) => p.id === s.pending.ownerId);
      if (!owner) return;
      const amt = s.pending.amount;
      const after = cur.money - amt;
      box.innerHTML = `<div class="chead" style="background:#e03131">⚠️ 통행료 경고!</div>` +
        `<div class="cbody">${avatarSVG(owner.avatar, 40)}` +
        `<div class="cline"><b>${esc(owner.name)}</b>님의 <b>${esc(cell.name)}</b>에 도착했어요!</div>` +
        `<div class="cline">통행료 <span class="warn">${amt}만원</span>을 내야 해요</div>` +
        `<div class="cline">내 자금 ${cur.money}만 → <b>${after}만</b></div>` +
        (after < 0 ? `<div class="warn">자금이 부족해요! 파산하면 게임이 끝나요</div>` : '') +
        `<div><button class="act" id="cPay">💸 통행료 내기</button></div>` +
        `<div class="small">25초 안에 누르지 않으면 자동으로 납부돼요</div></div>`;
      box.querySelector('#cPay').onclick = () => { socket.emit('pay'); hideCard(); };
      sfx.alert();
    } else return;
    box.classList.add('show');
    cardShown = true;
  }

  // ---------- 알림 / 종료 화면 ----------
  let toastTimer = null;
  const TOAST_COLORS = { good: '#2f9e44', bad: '#e03131', buy: '#6c5ce7', toll: '#e67700' };
  function showToast(nt) {
    const el = document.getElementById('toast');
    el.textContent = nt.text;
    el.style.background = TOAST_COLORS[nt.kind] || '#333';
    el.classList.add('show');
    if (nt.kind === 'good' || nt.kind === 'buy') sfx.coin();
    else sfx.alert();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }
  function showEnd() {
    const s = curState;
    const list = [...s.players].sort((a, b) => b.money - a.money);
    const medals = ['🥇', '🥈', '🥉', '4️⃣'];
    hideCard();
    hideDuel();
    const box = document.getElementById('endBox');
    box.innerHTML = '<h2>🏆 게임 종료!</h2>' +
      list.map((p, i) => `<div class="erow">${medals[i]} ${avatarSVG(p.avatar, 34)} <span class="en"></span> <b>${p.money}만원</b>${p.money < 0 ? ' (파산)' : ''}</div>`).join('') +
      '<button class="act" onclick="location.href=\'/\'">처음으로</button>';
    box.querySelectorAll('.en').forEach((el, i) => { el.textContent = list[i].name; });
    box.classList.add('show');
    sfx.win();
  }

  // ---------- 게임 화면 ----------
  document.getElementById('roll').onclick = () => socket.emit('roll');

  function build(board) {
    const b = document.getElementById('board');
    board.forEach((c, i) => {
      const d = document.createElement('div');
      d.className = 'cell';
      d.id = 'cell' + i;
      d.style.gridRow = POS[i][0] + 1;
      d.style.gridColumn = POS[i][1] + 1;
      const img = `<img src="/images/${i}.png" onerror="this.remove()">`;
      if (c.type === 'corner') {
        const sign = c.amount > 0 ? '+' : '';
        d.innerHTML = `<div class="hd" style="background:#868e96">${c.name}</div>` +
          `<div class="ill" style="background:${CORNER_BG[i]}"><span class="emo">${CORNER_EMO[i]}</span>${img}</div>` +
          `<div class="ft" style="color:${c.amount > 0 ? '#2f9e44' : '#e03131'}">${sign}${c.amount}만</div><div class="own"></div>`;
      } else {
        d.innerHTML = `<div class="hd" style="background:${groupColor(i)}">${c.name}</div>` +
          `<div class="ill">${bldSVG(i)}${img}</div>` +
          `<div class="ft">${c.price}만 · 통${c.toll}</div><div class="own"></div>`;
      }
      b.appendChild(d);
    });
    built = true;
  }

  function place(id) {
    const [r, c] = POS[shown[id]];
    const i = order.indexOf(id);
    const t = tokens[id];
    t.style.left = `calc(${c * 20}% + ${4 + (i % 2) * 33}px)`;
    t.style.top = `calc(${r * 20}% + ${20 + Math.floor(i / 2) * 26}px)`;
  }

  function moveToken(id, target) {
    clearTimeout(timers[id]);
    const step = () => {
      if (shown[id] === target) return;
      shown[id] = (shown[id] + 1) % POS.length;
      place(id);
      timers[id] = setTimeout(step, 250);
    };
    step();
  }

  socket.on('state', (s) => {
    curState = s;
    if (!built) build(s.board);
    order = s.players.map((p) => p.id);
    const cur = s.players[s.turn];
    const mine = cur && cur.id === myId;

    // 주사위 (새로 굴린 경우에만)
    const newRoll = seenSeq !== null && s.dice && s.dice.seq !== seenSeq;
    seenSeq = s.dice ? s.dice.seq : 0;
    if (newRoll) rollDice(s.dice.n);
    const walkDelay = newRoll ? 1300 + s.dice.n * 250 + 300 : 0;

    // 알림 (새로 생긴 경우에만, 말이 도착한 뒤에 보여줌)
    const newNotice = seenNotice !== null && s.notice && s.notice.seq !== seenNotice;
    seenNotice = s.notice ? s.notice.seq : 0;
    if (newNotice) {
      const nt = s.notice;
      setTimeout(() => showToast(nt), walkDelay + 150);
    }

    // 대결 (새로 시작된 경우에만, 말이 도착한 뒤에 보여줌)
    const newDuel = seenDuel !== null && s.duel && s.duel.seq !== seenDuel;
    seenDuel = s.duel ? s.duel.seq : 0;
    if (newDuel) {
      hideDuel();
      const delay = newRoll ? 1300 + s.dice.n * 250 + 400 : 500;
      const d = s.duel;
      duelShowTimer = setTimeout(() => showDuel(d), delay);
    } else if (s.phase !== 'swap' && duelVisible) {
      clearTimeout(duelHideTimer);
      duelHideTimer = setTimeout(hideDuel, 800);
    }

    // 구매 / 통행료 카드 (내 차례일 때만)
    const needCard = !s.ended && mine && (s.phase === 'buy' || s.phase === 'toll');
    if (needCard) {
      const key = s.phase + ':' + (s.dice ? s.dice.seq : 0) + ':' + s.turn;
      if (key !== seenCardKey) {
        seenCardKey = key;
        hideCard();
        cardTimer = setTimeout(() => showCard(), walkDelay + 200);
      }
    } else if (cardShown || cardTimer) {
      hideCard();
    }

    // 나간 사람의 말 지우기
    Object.keys(tokens).forEach((id) => {
      if (!order.includes(id)) {
        clearTimeout(timers[id]);
        tokens[id].remove();
        delete tokens[id];
        delete shown[id];
      }
    });

    // 말 만들기/이동
    s.players.forEach((p, i) => {
      if (!tokens[p.id]) {
        const t = document.createElement('div');
        t.className = 'token';
        t.innerHTML = '<div class="av">' + avatarSVG(p.avatar, 32) + '</div><div class="nick"></div>';
        t.querySelector('.nick').textContent = p.name;
        document.getElementById('board').appendChild(t);
        tokens[p.id] = t;
        shown[p.id] = p.pos;
      }
      tokens[p.id].querySelector('.nick').style.borderBottom = `3px solid ${COLORS[i]}`;
      tokens[p.id].classList.toggle('active', !s.ended && s.phase !== 'waiting' && i === s.turn);
      if (shown[p.id] === p.pos) {
        place(p.id);
      } else if (newRoll) {
        clearTimeout(timers[p.id]);
        timers[p.id] = setTimeout(() => moveToken(p.id, p.pos), 1300); // 주사위가 멈춘 뒤 이동
      } else {
        // 자리 교환 등: 걸어가지 않고 바로 이동
        clearTimeout(timers[p.id]);
        shown[p.id] = p.pos;
        place(p.id);
      }
    });

    // 건물 주인 표시
    s.board.forEach((c, i) => {
      const ownerIdx = order.indexOf(s.owners[i]);
      document.querySelector('#cell' + i + ' .own').style.borderColor = ownerIdx >= 0 ? COLORS[ownerIdx] : 'transparent';
    });

    // 상태 문구
    let status;
    if (s.ended) status = '게임 종료!';
    else if (s.phase === 'waiting') status = `대기 중 (${s.players.length}/4)`;
    else if (s.phase === 'swap') status = '⚔️ 대결 중!';
    else if (s.phase === 'buy') status = mine ? '🏫 카드를 확인하세요!' : `${esc(cur.name)}님이 구매를 고민 중...`;
    else if (s.phase === 'toll') status = mine ? '⚠️ 통행료를 내세요!' : `${esc(cur.name)}님이 통행료를 내는 중...`;
    else status = mine ? '내 차례입니다' : `${esc(cur.name)}의 차례`;
    document.getElementById('status').innerHTML = status;
    document.getElementById('evt').textContent = s.phase === 'waiting'
      ? `방 코드 ${s.code} · 친구에게 알려주세요`
      : `⚔️ 정기 대결까지 ${s.eventLeft}턴`;

    document.getElementById('players').innerHTML = s.players
      .map((p, i) => `<div class="prow"><span class="dot" style="background:${COLORS[i]}"></span>${avatarSVG(p.avatar, 16)}${p.id === myId ? '👉' : ''}${esc(p.name)} ${p.money}만</div>`)
      .join('');

    document.getElementById('roll').disabled = !(mine && s.phase === 'roll');

    const logEl = document.getElementById('log');
    logEl.innerHTML = s.log.map((l) => `<div>${esc(l)}</div>`).join('');
    logEl.scrollTop = logEl.scrollHeight;

    // 종료 화면
    if (s.ended && !endShown) {
      endShown = true;
      setTimeout(showEnd, 700);
    }
  });
</script>
</body>
</html>
